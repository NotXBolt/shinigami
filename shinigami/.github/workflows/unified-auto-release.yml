name: Shinigami Auto-Build & Release

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Setup JAVA_HOME
        run: echo "JAVA_HOME=/usr/lib/jvm/java-25-openjdk-arm64" >> $GITHUB_ENV
      - name: Build Shinigami (Universal 26.1.2 Fabric)
        run: |
          chmod +x gradlew
          ./gradlew :fabric:build -x test -x :fabric:proguard -x :fabric:createDist --no-daemon
      - name: Verify JAR output
        run: |
          ls -la fabric/build/libs/baritone-fabric-1.17.0.jar
          echo "JAR size: $(stat -c%s fabric/build/libs/baritone-fabric-1.17.0.jar) bytes"
      - name: Deploy to release
        run: |
          cp fabric/build/libs/baritone-fabric-1.17.0.jar /storage/emulated/0/1log/Shinigami-by-Saizo-1.17.0.jar || echo "Deploy target not available (expected in Termux)"
      - name: Upload Release Asset
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: Shinigami-by-Saizo-${{ github.ref_name }}
          path: fabric/build/libs/baritone-fabric-1.17.0.jar
