# This workflow will build a Java project with Gradle
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-gradle

name: Java CI with Gradle

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Build with Gradle
      run: |
        export JAVA_HOME=/usr/lib/jvm/java-25-openjdk-arm64
        ./gradlew :fabric:build -x test -x :fabric:proguard -x :fabric:createDist --no-daemon

    - name: Verify JAR output
      run: |
        ls -lh fabric/build/libs/baritone-fabric-*.jar 2>/dev/null || echo "JAR not found"
