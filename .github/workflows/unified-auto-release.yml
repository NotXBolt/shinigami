name: Shinigami Auto-Build & Release

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Build Shinigami (Universal 26.1.2 Fabric)
        run: |
          chmod +x gradlew
          ./gradlew :fabric:build -x test -x :fabric:proguard -x :fabric:createDist --no-daemon
      - name: Verify JAR output
        run: |
          ls -lah fabric/build/libs/ || true
          ls -la fabric/build/libs/*.jar || (echo "No JAR found" && exit 1)
          echo "JAR size: $(stat -c%s fabric/build/libs/*.jar | head -1) bytes"
      - name: Upload Artifact (branch builds)
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: Shinigami-by-Saizo-${{ github.sha }}
          path: fabric/build/libs/*.jar
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: fabric/build/libs/*.jar
          generate_release_notes: true
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
