name: Shinigami Auto-Build & Release

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Resolve version
        id: ver
        run: |
          MOD_VERSION=$(grep '^mod_version=' gradle.properties | cut -d= -f2 | tr -d ' ')
          echo "mod_version=$MOD_VERSION" >> $GITHUB_OUTPUT
          echo "Using mod_version=$MOD_VERSION"
      - name: Build Shinigami (Universal 26.1.2 Fabric)
        run: |
          chmod +x gradlew
          ./gradlew :fabric:build -x test -x :fabric:proguard -x :fabric:createDist --no-daemon
      - name: Brand JAR (Shinigami-by-Saizo)
        run: |
          ls -lh fabric/build/libs/
          BRANDED="fabric/build/libs/Shinigami-by-Saizo-${{ steps.ver.outputs.mod_version }}.jar"
          cp fabric/build/libs/baritone-fabric-*.jar "$BRANDED" 2>/dev/null || cp $(ls fabric/build/libs/*.jar | head -1) "$BRANDED"
          ls -lh fabric/build/libs/
          echo "BRANDED=$BRANDED" >> $GITHUB_ENV
      - name: Verify JAR output
        run: |
          ls -lah fabric/build/libs/Shinigami-by-Saizo-*.jar
          echo "JAR size: $(stat -c%s fabric/build/libs/Shinigami-by-Saizo-*.jar) bytes"
      - name: Upload Artifact (branch builds)
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: Shinigami-by-Saizo-${{ steps.ver.outputs.mod_version }}-${{ github.sha }}
          path: fabric/build/libs/Shinigami-by-Saizo-*.jar
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Shinigami by Saizo v${{ steps.ver.outputs.mod_version }}
          files: fabric/build/libs/Shinigami-by-Saizo-*.jar
          generate_release_notes: true
          fail_on_unmatched_files: false
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}